name: '[Tenklo] Deploy production'

# Builds and deploys master to the production host. The job runs on the self-hosted runner installed on that host
# (label tenklo-production), so the image is built where it runs and nothing is pushed to a registry.
#
# Configuration lives in the `production` environment:
#   variables: TENKLO_API_URL, TENKLO_APP_URL, TENKLO_CONNECT_URL (optional: NPM_NETWORK)
#   secrets:   DB_PASSWORD, ENCRYPTION_KEY, DASHBOARD_USERNAME, DASHBOARD_PASSWORD, WHATSAPP_GATEWAY_SECRET,
#              WHATSAPP_SESSION_ENCRYPTION_KEY, WHATSAPP_S3_ACCESS_KEY, WHATSAPP_S3_SECRET_KEY
# The environment only accepts deployments from master.

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-tenklo-production
    cancel-in-progress: false

jobs:
    deploy:
        if: github.repository == 'brphantomtech/tenklo'
        runs-on: [self-hosted, tenklo-production]
        environment:
            name: production
            url: ${{ vars.TENKLO_APP_URL }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Build and deploy
              run: bash deploy/tenklo/deploy.sh
              env:
                  TENKLO_API_URL: ${{ vars.TENKLO_API_URL }}
                  TENKLO_APP_URL: ${{ vars.TENKLO_APP_URL }}
                  TENKLO_CONNECT_URL: ${{ vars.TENKLO_CONNECT_URL }}
                  NPM_NETWORK: ${{ vars.NPM_NETWORK }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
                  DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
                  DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
                  WHATSAPP_GATEWAY_SECRET: ${{ secrets.WHATSAPP_GATEWAY_SECRET }}
                  WHATSAPP_SESSION_ENCRYPTION_KEY: ${{ secrets.WHATSAPP_SESSION_ENCRYPTION_KEY }}
                  WHATSAPP_S3_ACCESS_KEY: ${{ secrets.WHATSAPP_S3_ACCESS_KEY }}
                  WHATSAPP_S3_SECRET_KEY: ${{ secrets.WHATSAPP_S3_SECRET_KEY }}
